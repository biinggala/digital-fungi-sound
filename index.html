<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Digital Fungi Sound</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="src/ds.css?v=3">
<style>
  /* 배치와 이 앱에만 있는 부품. 색 · 크기는 모두 src/ds.css 토큰 (mockups/lint-ds.sh로 검사) */
  :root { color-scheme: dark; }
  html, body { height: 100%; overflow: hidden; overflow: clip; }  /* clip: 넘친 줄 때문에 페이지 전체가 옆으로 밀리지 않게 */
  /* 화면보다 넓어지는 줄(상단 줄 · 독 · 열린 판)은 그 줄만 가로로 넘긴다 — 터치는 밀어서, 트랙패드는 가로로, 마우스는 휠로 (main.js) */
  .top .row, .dock, .panel > .page { overflow-x: auto; overscroll-behavior-x: contain; scrollbar-width: none; }
  .top .row::-webkit-scrollbar, .dock::-webkit-scrollbar, .panel > .page::-webkit-scrollbar { display: none; }
  .dock > * { flex: none; }
  /* 넘친 쪽 가장자리를 흐리게: 옆에 더 있다는 표시 (main.js가 is-more-l · is-more-r를 붙인다) */
  .is-more-r { mask-image: linear-gradient(to right, black calc(100% - var(--s8)), transparent); }
  .is-more-l { mask-image: linear-gradient(to left, black calc(100% - var(--s8)), transparent); }
  .is-more-l.is-more-r { mask-image: linear-gradient(to right, transparent, black var(--s8), black calc(100% - var(--s8)), transparent); }
  .mod.grow { min-width: calc(var(--col) * 4 + var(--gut) * 3 + var(--pad) * 2); }
  body { display: flex; flex-direction: column; user-select: none; }
  .hidden { display: none !important; }

  /* 무대 */
  #stage { position: relative; flex: 1; min-height: calc(var(--u) * 5); margin: 0; background: var(--bg-stage); }
  #world { position: absolute; inset: 0; width: 100%; height: 100%; display: block; cursor: crosshair; touch-action: none; }
  #scalebar { position: absolute; right: var(--s6); bottom: var(--s4); display: flex; align-items: center; gap: var(--s2); pointer-events: none; }
  #scalebar i { display: block; height: var(--stroke-2); background: var(--text-1); }
  .stage-tools { display: none; position: absolute; left: var(--s4); right: var(--s4); bottom: var(--s4); justify-content: space-between; }
  .stage-tools .seg { background: var(--bg-page); }

  /* 겹쳐 뜨는 판: 도움말 · 연락처 */
  .float { position: absolute; padding: var(--s3) var(--s4); background: var(--bg-page); border: var(--stroke) solid var(--line); line-height: var(--s6); }
  #help { left: var(--s4); bottom: var(--s4); max-width: calc(var(--u) * 26); color: var(--text-2); }
  #help b { color: var(--text-1); font-weight: 400; text-transform: uppercase; margin-right: var(--s2); }
  #legend { margin-top: var(--s2); }
  #legend .sw { margin-right: var(--s1); }
  #contact { right: var(--s4); top: var(--s4); min-width: calc(var(--u) * 12); }
  #contact dl { display: grid; grid-template-columns: calc(var(--col) + var(--s4)) auto; column-gap: var(--s3); margin: var(--s2) 0 0; align-items: center; }
  #contact dd { margin: 0; display: flex; align-items: center; gap: var(--s2); white-space: nowrap; }
  #contact a { color: var(--text-1); text-decoration: none; border-bottom: var(--stroke) solid var(--line-ctl); }
  #contact a:hover, #contact a:focus-visible { color: var(--text-em); border-bottom-color: var(--text-em); }
  #contact .mail { user-select: text; }

  /* 판 */
  .page { display: none; flex: 1; min-width: 0; }
  .page.is-on { display: flex; }

  /* 건반: 으뜸음 고르기. 고른 건반 = 선택 반전 */
  .kb { position: relative; height: calc(var(--u) * 2 + var(--s2)); cursor: pointer; }
  .kb i { position: absolute; top: 0; }
  .kb .w { height: 100%; background: var(--line-ctl); border-right: var(--stroke) solid var(--bg-panel); }
  .kb .b { height: 60%; background: var(--bg-stage); border: var(--stroke) solid var(--line-ctl); border-top: 0; z-index: 1; }
  .kb i:hover { background: var(--text-3); }
  .kb i.is-sel { background: var(--sel-bg); border-color: var(--sel-bg); }

  .scales > button { text-transform: none; }
  .styles > button { grid-template-columns: var(--s2) calc(var(--col) - var(--s2)) 1fr; }
  select.plain { appearance: none; -webkit-appearance: none; height: var(--u); padding: 0 var(--s2); border: var(--stroke) solid var(--line-ctl); border-radius: var(--r);
    background: var(--bg-panel); color: var(--text-1); font: inherit; letter-spacing: inherit; cursor: pointer; max-width: 100%; }
  select.plain option { background: var(--bg-panel); }
  .readouts { display: grid; grid-template-columns: repeat(auto-fill, minmax(calc(var(--col) + var(--s4)), 1fr)); gap: var(--s3) var(--s4); }
  .readouts .ro { width: auto; align-items: flex-start; }
  .readouts .v { white-space: nowrap; }

  /* 믹서: 채널 = 이름 | 스타일 띠 | 섞인 상태 | 음량 */
  #mixer { display: grid; grid-template-columns: repeat(auto-fill, minmax(calc(var(--col) * 6), 1fr)); column-gap: var(--s8); row-gap: var(--s1); }
  .chan { display: grid; grid-template-columns: calc(var(--col) + var(--s6)) minmax(calc(var(--col) * 2), 1fr) calc(var(--col) + var(--s4)) var(--col); align-items: center; gap: var(--s3); height: var(--u); }
  .chan .name { color: var(--text-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .chan .name.is-loud { color: var(--text-1); }
  .chan output { color: var(--text-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  /* 스타일 띠: 칸 6개 (스타일마다 하나). 윗선이 그 스타일의 범주색, 바탕은 섞인 정도만큼 밝다. 손잡이 = 흰 세로선 */
  .track { position: relative; display: grid; gap: var(--stroke-2); height: var(--s4); cursor: ew-resize; touch-action: none; }
  .track i { background: var(--fill); border-top: var(--stroke-2) solid; position: relative; }
  .track i::after { content: ''; position: absolute; inset: 0; background: var(--fill-2); opacity: var(--w, 0); }
  .track b { position: absolute; top: calc(var(--s1) * -1); bottom: calc(var(--s1) * -1); width: var(--stroke-2); margin-left: calc(var(--stroke) * -1); background: var(--text-em); pointer-events: none; }
  .bar { cursor: ew-resize; touch-action: none; padding: var(--s2) 0; }

  #scope { width: 100%; height: calc(var(--u) * 4); display: block; }

  /* 곡: 장면 블록. 폭 = 길이(마디), 윗선 = 장면의 스타일 범주색, 지금 장면은 아래 신호색 막대로 진행 */
  .arr { display: flex; gap: var(--stroke-2); height: calc(var(--u) * 3); }
  .arr[hidden] { display: none; }
  .scene { position: relative; min-width: calc(var(--col) + var(--s4)); background: var(--fill); border-top: var(--stroke-2) solid var(--text-3);
    padding: var(--s1) var(--s2); display: flex; flex-direction: column; justify-content: space-between; overflow: hidden; cursor: pointer; text-align: left; }
  .scene:hover { background: var(--line); }
  .scene .lbl, .scene .t3 { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .scene.is-sel { background: var(--sel-bg); color: var(--sel-fg); }
  .scene.is-sel .lbl, .scene.is-sel .t3 { color: var(--n6); }
  .scene .run { position: absolute; left: 0; bottom: 0; height: var(--stroke-2); background: var(--live); }
  .row-btns { display: flex; flex-wrap: wrap; gap: var(--s1); }

  /* 패치 베이: 위 줄 = 소스(균사체), 아래 줄 = 목적지(소리). 잭 아래 막대 = 지금 값 */
  .bay { position: relative; flex: 1; min-height: calc(var(--u) * 6); display: flex; flex-direction: column; justify-content: space-between; touch-action: none; }
  .jrow { position: relative; z-index: 1; display: flex; justify-content: space-between; }
  .jack { display: flex; flex-direction: column; align-items: center; gap: var(--s1); width: var(--col); cursor: crosshair; }
  .jack svg { display: block; }
  .jack .o { fill: var(--bg-panel); stroke: var(--text-3); }
  .jack .i { fill: var(--bg-stage); stroke: var(--line-ctl); }
  .jack.used .o { stroke: var(--text-1); }
  .jack:hover .o, .jack.is-sel .o { stroke: var(--text-em); }
  .jack.is-sel .i { fill: var(--sel-bg); }
  .jack .meter { width: calc(var(--col) - var(--s4)); }
  .cables { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; }
  .cables path { fill: none; stroke: var(--text-2); stroke-width: var(--stroke-2); }
  .cables circle { fill: var(--text-2); }
  .cables .is-sel path { stroke: var(--text-em); } .cables .is-sel circle { fill: var(--text-em); }
  .cables .drag path { stroke: var(--text-1); stroke-dasharray: 4 4; }
  .cablelist > button { grid-template-columns: 1fr calc(var(--col) - var(--s2)); }
  .cablelist > button > :last-child { text-align: right; }

  /* 화음: 근음 링 (5도권) */
  .ring { display: block; margin: 0 auto; }
  .ring .s { cursor: pointer; }
  .ring .s path { fill: var(--fill); stroke: var(--bg-panel); stroke-width: var(--stroke-2); }
  .ring .s text { fill: var(--text-3); font: var(--t-m) var(--font); }
  .ring .s.near text { fill: var(--text-1); }
  .ring .s:hover path { fill: var(--line); }
  .ring .s.is-sel path { fill: var(--sel-bg); } .ring .s.is-sel text { fill: var(--sel-fg); }
  .ring .c1 { fill: var(--text-em); font: var(--t-l) var(--font); }
  .ring .c2 { fill: var(--text-2); font: var(--t-s) var(--font); letter-spacing: var(--t-s-track); }
  .ring.is-off .s path { fill: var(--bg-panel); stroke: var(--fill); }
  /* 구성음 건반 (보기 전용): 울리는 음 = 선택 반전, 근음 = 아래 홈 */
  /* 두 옥타브 = 흰 건반 15개, 한 칸 1u. 판이 넓어도 늘어나지 않는다 */
  .kb.show { cursor: default; width: calc(var(--u) * 15); max-width: 100%; }
  .kb.show i:hover { background: inherit; }
  .kb .w.on, .kb .b.on { background: var(--sel-bg); border-color: var(--sel-bg); }
  .kb .root::after { content: ''; position: absolute; left: 25%; right: 25%; bottom: var(--s1); height: var(--stroke-2); background: var(--sel-fg); }
  .prog { display: flex; gap: var(--s1); }
  .prog span { flex: 1; height: var(--u); display: flex; align-items: center; justify-content: center; border: var(--stroke) solid var(--line-ctl); border-radius: var(--r); color: var(--text-2); white-space: nowrap; }
  .prog span.is-sel { background: var(--sel-bg); color: var(--sel-fg); border-color: var(--sel-bg); }
  .prog span:has(b) { flex-direction: column; height: auto; padding-block: var(--s1); min-width: 0; }
  .prog span b { font-weight: inherit; font-size: var(--t-s); letter-spacing: var(--t-s-track); color: var(--text-3); }
  .prog span.is-sel b { color: inherit; }
  .ring .now { fill: var(--live); pointer-events: none; }
  /* 공간 XY: 가로 = 에코, 세로 = 잔향 */
  .xy { position: relative; width: calc(var(--u) * 7); height: calc(var(--u) * 7); cursor: crosshair; touch-action: none;
    background-image: linear-gradient(var(--fill) 1px, transparent 1px), linear-gradient(90deg, var(--fill) 1px, transparent 1px);
    background-size: var(--u) var(--u); }
  .xy .h, .xy .vv { position: absolute; background: var(--text-2); pointer-events: none; }
  .xy .h { left: 0; right: 0; height: var(--stroke); } .xy .vv { top: 0; bottom: 0; width: var(--stroke); }
  .xy .pt { position: absolute; width: var(--s2); height: var(--s2); margin: calc(var(--s1) * -1); background: var(--text-em); pointer-events: none; }

  @media (max-width: 600px) {
    .stage-tools { display: flex; }
    .stage-tools .seg > button { min-width: var(--u); justify-content: center; }
    #help { left: var(--s2); right: var(--s2); bottom: calc(var(--u) + var(--s6)); max-width: none; }
    #contact { left: var(--s2); right: var(--s2); top: var(--s2); min-width: 0; }
    #mixer { grid-template-columns: minmax(0, 1fr); }
    .chan output { display: none; }
    .chan { grid-template-columns: calc(var(--col) + var(--s4)) minmax(0, 1fr) calc(var(--col) - var(--s4)); gap: var(--s2); }
    .xy { width: 100%; height: auto; aspect-ratio: 1; }
    .arr { overflow-x: auto; }
    .jack { width: auto; flex: 1; }
    .jack .lbl { letter-spacing: .02em; }
    .jack .meter { width: 70%; }
  }
</style>
</head>
<body>

<header class="top">
  <div><span class="ttl">Digital Fungi</span> <span class="lbl lbl-3">♪ sound by</span> <span class="lbl">Heegun Choi</span></div>
  <div class="row">
    <span class="grp">
      <button class="btn" id="pause"></button>
      <button class="btn" id="reset" data-i18n-title="reset.t"></button>
      <button class="btn" id="rec" data-i18n-title="rec.t"></button>
    </span>
    <span class="grp hide-m"><span class="lbl" data-i18n="tool"></span>
      <span class="seg">
        <button data-tool="spore" data-i18n-title="tool.spore.t">◉ <span data-i18n="tool.spore"></span></button>
        <button data-tool="food" data-i18n-title="tool.food.t">▦ <span data-i18n="tool.food"></span></button>
        <button data-tool="stim" data-i18n-title="tool.stim.t">ϟ <span data-i18n="tool.stim"></span></button>
        <button data-tool="probe" data-i18n-title="tool.probe.t">⌖ <span data-i18n="tool.probe"></span></button>
      </span></span>
    <span class="grp hide-m"><span class="lbl" data-i18n="view"></span>
      <span class="seg"><button data-view="colony" data-i18n="view.colony"></button><button data-view="flow" data-i18n="view.flow"></button></span></span>
    <span class="grp push">
      <button class="btn" id="soundOn" data-i18n-title="soundOn.t"></button>
      <button class="btn" id="helpBtn" data-i18n-title="helpTitle"><span class="txt" data-i18n="help"></span><span class="ico-m">?</span></button>
      <button class="btn hide-m" id="contactBtn" data-i18n="contact" data-i18n-title="contactTitle"></button>
      <button class="btn" id="lang" data-i18n="lang" data-i18n-title="langTitle"></button>
    </span>
  </div>
</header>

<main id="stage">
  <canvas id="world"></canvas>
  <div id="scalebar"><i></i><span class="lbl"></span></div>
  <div class="stage-tools">
    <span class="seg"><button data-tool="spore">◉</button><button data-tool="food">▦</button><button data-tool="stim">ϟ</button><button data-tool="probe">⌖</button></span>
    <span class="seg"><button data-view="colony" data-i18n="view.colony"></button><button data-view="flow" data-i18n="view.flow"></button></span>
  </div>
  <div id="contact" class="float" hidden>
    <div class="lbl lbl-1">Heegun Choi</div>
    <dl>
      <dt class="lbl">Instagram</dt><dd><a href="https://www.instagram.com/biinggala/" target="_blank" rel="noopener">@biinggala ↗</a></dd>
      <dt class="lbl">GitHub</dt><dd><a href="https://github.com/biinggala" target="_blank" rel="noopener">biinggala ↗</a></dd>
      <dt class="lbl" data-i18n="email"></dt><dd><span class="mail" id="mail">biinggala@gmail.com</span><button class="btn" id="copyMail" data-i18n="copy"></button></dd>
    </dl>
  </div>
  <div id="help" class="float" hidden>
    <div data-i18n-html="help.body"></div>
    <div id="legend"></div>
  </div>
</main>

<div class="panel" id="panel">

  <!-- 화음 -->
  <div class="page" id="p-chord">
    <section class="mod c3">
      <div class="mod-hd"><span class="lbl" data-i18n="ch.root"></span><span class="lbl lbl-3" data-i18n="ch.fifths"></span></div>
      <div class="mod-body"><svg class="ring" id="ring" width="200" height="200" viewBox="-104 -104 208 208"></svg></div>
    </section>
    <section class="mod c2">
      <div class="mod-hd"><span class="lbl" data-i18n="ch.quality"></span></div>
      <div class="mod-body"><div class="list cols-2 scales" id="quals"></div></div>
    </section>
    <section class="mod c3">
      <div class="mod-hd"><span class="lbl" data-i18n="ch.source"></span></div>
      <div class="mod-body">
        <div class="list" id="chordMode">
          <button data-mode="scale" style="grid-template-columns:1fr auto"><span class="name" data-i18n="ch.m.scale"></span><span class="lbl" data-i18n="ch.m.scale.d"></span></button>
          <button data-mode="hold" style="grid-template-columns:1fr auto"><span class="name" data-i18n="ch.m.hold"></span><span class="lbl" data-i18n="ch.m.hold.d"></span></button>
          <button data-mode="network" style="grid-template-columns:1fr auto"><span class="name" data-i18n="ch.m.network"></span><span class="lbl" data-i18n="ch.m.network.d"></span></button>
        </div>
      </div>
      <div class="mod-foot t3" id="chordHint"></div>
    </section>
    <section class="mod grow">
      <div class="mod-hd"><span class="lbl" data-i18n="ch.now"></span><span class="val-em" id="chordNow"></span></div>
      <div class="mod-body">
        <div class="kb show" id="chordKb"></div>
        <div class="encs" id="chordTones" style="justify-content:start"></div>
      </div>
      <div class="mod-foot"><div class="prog" id="prog"></div></div>
    </section>
    <section class="mod c3">
      <div class="mod-hd"><span class="lbl" data-i18n="ch.space"></span></div>
      <div class="mod-body"><div class="frame xy" id="xy"><i class="h"></i><i class="vv"></i><i class="pt"></i></div></div>
      <div class="mod-foot encs"><span class="ro"><span class="v" id="xyEcho"></span><span class="lbl" data-i18n="echo"></span></span><span class="ro"><span class="v" id="xyRev"></span><span class="lbl" data-i18n="reverb"></span></span></div>
    </section>
  </div>

  <!-- 소리 -->
  <div class="page" id="p-sound">
    <section class="mod c4">
      <div class="mod-hd"><span class="lbl" data-i18n="style"></span><span class="lbl lbl-3" id="mixedTag" data-i18n="style.mix"></span></div>
      <div class="mod-body"><div class="list styles" id="presets"></div></div>
    </section>
    <section class="mod c4">
      <div class="mod-hd"><span class="lbl" data-i18n="key"></span></div>
      <div class="mod-body"><span class="big" id="keyName"></span><div class="kb" id="keys"></div></div>
    </section>
    <section class="mod c4">
      <div class="mod-hd"><span class="lbl" data-i18n="scale"></span></div>
      <div class="mod-body"><div class="list cols-2 scales" id="scales"></div></div>
    </section>
    <section class="mod c4">
      <div class="mod-hd"><span class="lbl" data-i18n="m.output"></span></div>
      <div class="mod-body">
        <div data-i18n-title="midi.t" style="display:flex;gap:var(--s2);align-items:center">
          <span class="lbl">MIDI</span><button class="btn" id="midiBtn" data-i18n="midi.connect"></button><select class="plain" id="midiOut" hidden></select>
        </div>
      </div>
      <div class="mod-foot encs">
        <div class="enc ro"><output class="v"></output><span class="lbl" data-i18n="volume"></span><input type="range" class="hidden" id="volume" min="0" max="1" step="0.01" value="0.7"></div>
        <div class="enc ro"><output class="v"></output><span class="lbl" data-i18n="reverb"></span><input type="range" class="hidden" id="reverb" min="0" max="1" step="0.01" value="0.55"></div>
        <div class="enc ro" data-i18n-title="echo.t"><output class="v"></output><span class="lbl" data-i18n="echo"></span><input type="range" class="hidden" id="echo" min="0" max="1" step="0.01" value="0"></div>
      </div>
    </section>
    <section class="mod grow">
      <div class="mod-hd"><span class="lbl" data-i18n="m.now"></span><span class="lbl lbl-3" id="soundState"></span></div>
      <div class="mod-body"><div class="readouts" id="soundStats"></div></div>
    </section>
  </div>

  <!-- 믹서 -->
  <div class="page" id="p-mixer">
    <section class="mod grow">
      <div class="mod-hd"><span class="lbl" data-i18n="mixer"></span><span class="lbl lbl-3 hide-m" data-i18n="mixer.t"></span></div>
      <div class="mod-body"><div id="mixer"></div></div>
    </section>
  </div>

  <!-- 곡 -->
  <div class="page" id="p-song">
    <section class="mod grow">
      <div class="mod-hd"><span class="lbl" data-i18n="sg.arrange"></span><span class="lbl lbl-3 hide-m" data-i18n="sg.hint"></span></div>
      <div class="mod-body"><div class="arr" id="arr"></div><div class="t3" id="songEmpty" data-i18n="sg.empty"></div></div>
      <div class="mod-foot encs" style="grid-auto-columns:auto;column-gap:var(--s8);justify-content:start" id="songRo"></div>
    </section>
    <section class="mod c4">
      <div class="mod-hd"><span class="lbl" data-i18n="sg.scene"></span><span class="val-em" id="sceneName"></span></div>
      <div class="mod-body">
        <span class="t2" id="sceneSum"></span>
        <div style="display:flex;align-items:center;gap:var(--s2)"><span class="lbl" data-i18n="sg.next"></span>
          <span class="seg" id="nextType"><button data-next="bars" data-i18n="sg.t.bars"></button><button data-next="tips" data-i18n="sg.t.tips"></button><button data-next="loops" data-i18n="sg.t.loops"></button><button data-next="fruit" data-i18n="sg.t.fruit"></button></span></div>
        <div class="row-btns"><button class="btn" id="sceneLoad" data-i18n="sg.load"></button><button class="btn" id="sceneUpdate" data-i18n="sg.update"></button><button class="btn" id="sceneLeft">◂</button><button class="btn" id="sceneRight">▸</button><button class="btn" id="sceneDel" data-i18n="sg.delete"></button></div>
      </div>
      <div class="mod-foot encs">
        <div class="enc ro"><output class="v"></output><span class="lbl" id="nextLbl"></span><input type="range" class="hidden" id="nextN" min="1" max="64" step="1" value="16"></div>
        <div class="enc ro" data-i18n-title="sg.max.t"><output class="v"></output><span class="lbl" data-i18n="sg.max"></span><input type="range" class="hidden" id="nextMax" min="4" max="128" step="4" value="64"></div>
      </div>
    </section>
    <section class="mod c3">
      <div class="mod-hd"><span class="lbl" data-i18n="sg.transport"></span></div>
      <div class="mod-body">
        <span class="seg fill" id="songMode"><button data-smode="stop">■</button><button data-smode="song">▶ <span data-i18n="sg.play"></span></button><button data-smode="scene">⟲ <span data-i18n="sg.loop"></span></button></span>
        <button class="btn" id="capture" data-i18n="sg.capture"></button>
      </div>
      <div class="mod-foot encs">
        <div class="enc ro"><output class="v"></output><span class="lbl">BPM</span><input type="range" class="hidden" id="songBpm" min="40" max="200" step="1" value="88"></div>
      </div>
    </section>
  </div>

  <!-- 패치 -->
  <div class="page" id="p-patch">
    <section class="mod grow">
      <div class="mod-hd"><span class="lbl" data-i18n="pt.bay"></span><span class="lbl lbl-3 hide-m" data-i18n="pt.hint"></span></div>
      <div class="bay" id="bay"><div class="jrow" id="outs"></div><div class="jrow" id="ins"></div><svg class="cables" id="cables"></svg></div>
    </section>
    <section class="mod c4">
      <div class="mod-hd"><span class="lbl" data-i18n="pt.cables"></span><span class="lbl lbl-3" id="cableCount"></span></div>
      <div class="mod-body"><div class="list cablelist" id="cableList"></div><div class="t3" id="cableEmpty" data-i18n="pt.empty"></div></div>
      <div class="mod-foot encs" style="align-items:end">
        <div class="enc ro" data-i18n-title="pt.amt.t"><output class="v"></output><span class="lbl" data-i18n="pt.amt"></span><input type="range" class="hidden" id="cableAmt" min="-1" max="1" step="0.01" value="0.5"></div>
        <button class="btn" id="cableDel" data-i18n="sg.delete" style="margin-bottom:var(--s4)"></button>
      </div>
    </section>
  </div>

  <!-- 시뮬레이션 -->
  <div class="page" id="p-sim">
    <section class="mod c3">
      <div class="mod-hd"><span class="lbl" data-i18n="grow"></span></div>
      <div class="mod-body"></div>
      <div class="mod-foot encs rows-2" style="grid-template-columns:repeat(3, var(--col))">
        <div class="enc ro"><output class="v"></output><span class="lbl" data-i18n="p.speed"></span><input type="range" class="hidden" id="speed" min="1" max="12" step="1" value="1"></div>
        <div class="enc ro"><output class="v"></output><span class="lbl" data-i18n="p.branch"></span><input type="range" class="hidden" id="branch" min="0" max="0.1" step="0.002" value="0.04"></div>
        <div class="enc ro"><output class="v"></output><span class="lbl" data-i18n="p.chemo"></span><input type="range" class="hidden" id="chemo" min="0" max="3" step="0.1" value="1"></div>
        <div class="enc ro"><output class="v"></output><span class="lbl" data-i18n="p.avoid"></span><input type="range" class="hidden" id="avoid" min="0" max="2" step="0.05" value="0.3"></div>
        <div class="enc ro"><output class="v"></output><span class="lbl" data-i18n="p.adapt"></span><input type="range" class="hidden" id="adapt" min="0.002" max="0.08" step="0.002" value="0.02"></div>
        <div class="enc ro" data-i18n-title="p.flowExp.t"><output class="v"></output><span class="lbl" data-i18n="p.flowExp"></span><input type="range" class="hidden" id="flowExp" min="0.5" max="3" step="0.1" value="1.5"></div>
      </div>
    </section>
    <section class="mod c2">
      <div class="mod-hd"><span class="lbl" data-i18n="elec"></span></div>
      <div class="mod-body"></div>
      <div class="mod-foot encs rows-2" style="grid-template-columns:repeat(2, var(--col))">
        <div class="enc ro" data-i18n-title="p.spontaneous.t"><output class="v"></output><span class="lbl" data-i18n="p.spontaneous"></span><input type="range" class="hidden" id="spontaneous" min="0" max="0.02" step="0.001" value="0.004"></div>
        <div class="enc ro" data-i18n-title="p.elecRecovery.t"><output class="v"></output><span class="lbl" data-i18n="p.elecRecovery"></span><input type="range" class="hidden" id="elecRecovery" min="0.001" max="0.02" step="0.001" value="0.003"></div>
        <div class="enc ro" data-i18n-title="p.fusionConduct.t"><output class="v"></output><span class="lbl" data-i18n="p.fusionConduct"></span><input type="range" class="hidden" id="fusionConduct" min="0" max="1" step="0.05" value="1"></div>
        <div class="enc ro" data-i18n-title="p.spikeResponse.t"><output class="v"></output><span class="lbl" data-i18n="p.spikeResponse"></span><input type="range" class="hidden" id="spikeResponse" min="0" max="6" step="0.5" value="3"></div>
      </div>
    </section>
    <section class="mod c2">
      <div class="mod-hd"><span class="lbl" data-i18n="fruitGrp"></span></div>
      <div class="mod-body"></div>
      <div class="mod-foot encs rows-2" style="grid-template-columns:repeat(2, var(--col))">
        <div class="enc ro" data-i18n-title="p.matGrowth.t"><output class="v"></output><span class="lbl" data-i18n="p.matGrowth"></span><input type="range" class="hidden" id="matGrowth" min="0" max="0.06" step="0.002" value="0.02"></div>
        <div class="enc ro" data-i18n-title="p.matSpread.t"><output class="v"></output><span class="lbl" data-i18n="p.matSpread"></span><input type="range" class="hidden" id="matSpread" min="0" max="0.2" step="0.01" value="0.12"></div>
        <div class="enc ro" data-i18n-title="p.fruitSat.t"><output class="v"></output><span class="lbl" data-i18n="p.fruitSat"></span><input type="range" class="hidden" id="fruitSat" min="0" max="0.1" step="0.005" value="0.03"></div>
        <div class="enc ro" data-i18n-title="p.fruitShare.t"><output class="v"></output><span class="lbl" data-i18n="p.fruitShare"></span><input type="range" class="hidden" id="fruitShare" min="0.1" max="0.9" step="0.05" value="0.5"></div>
      </div>
    </section>
    <section class="mod c4">
      <div class="mod-hd"><span class="lbl" data-i18n="scope"></span><span class="lbl lbl-3" data-i18n="tool.probe.t"></span></div>
      <div class="mod-body"><canvas class="frame" id="scope" width="560" height="192"></canvas></div>
      <div class="mod-foot">
        <div class="mod-hd" style="margin:0"><span class="lbl" data-i18n="m.env"></span></div>
        <div style="display:flex;flex-wrap:wrap;gap:var(--s2)">
          <span class="seg" data-i18n-title="transport.t"><button data-transport="local" data-i18n="transport.local"></button><button data-transport="global" data-i18n="transport.global"></button></span>
          <button class="btn" id="soil"></button><button class="btn" id="matToggle"></button>
          <button class="btn" id="fit" data-i18n-title="fit.t"><span>⤢</span> <output id="zoom">1.0×</output></button>
        </div>
      </div>
    </section>
    <section class="mod grow">
      <div class="mod-hd"><span class="lbl" data-i18n="m.net"></span><span class="lbl is-live hidden" id="fullTag">full</span></div>
      <div class="mod-body"><div class="readouts" id="simStats"></div></div>
    </section>
  </div>
</div>

<nav class="dock">
  <div class="tab" data-p="chord" data-i18n-title="panel.t"><span class="lbl" data-i18n="page.chord"></span><span class="val" id="dkChord"></span></div>

  <div class="tab" data-p="mixer" data-i18n-title="panel.t"><span class="lbl" data-i18n="page.mixer"></span><span class="val" id="dkVoices"></span></div>
